services:
  - type: web
    name: industrial-edge
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/categories
    envVars:
      - key: NODE_ENV
        value: production
      - key: SQLITE_DB_PATH
        value: ./data/industrial_edge.sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true

# If you upgrade to Render Starter ($7/mo) to keep SQLite data across redeploys with a Persistent Disk:
# Add the disk block under services:
#    disk:
#      name: industrial-edge-disk
#      mountPath: /var/data
#      sizeGB: 1
# And change SQLITE_DB_PATH to: /var/data/industrial_edge.sqlite
