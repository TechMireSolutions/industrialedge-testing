version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: industrial_edge_postgres
    restart: always
    environment:
      POSTGRES_DB: industrial_edge_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d industrial_edge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: industrial_edge_api
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: industrial_edge_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: production-secret-industrial-edge-v2-secure
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:3000
      CDN_BASE_URL: https://cdn.industrialedge.pk
      UPLOAD_DIR: /app/uploads
    ports:
      - "5000:5000"
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  api_uploads:
